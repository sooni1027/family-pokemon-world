<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가족 포켓몬 월드</title>
<meta name="theme-color" content="#c9e6f8">
<style>
  :root{
    --ink:#1e2a3a;
    --muted:#5d7186;
    --blue:#1d6ec4;
    --sky:#d7ecfb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#eaf7ff 0%,#cfe9fb 55%,#bfe0f7 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;padding:clamp(16px,4vw,48px);
  }
  h1{
    font-size:clamp(22px,3.4vw,34px);
    margin:0 0 6px;text-align:center;letter-spacing:-.02em;
  }
  p.sub{
    margin:0 0 clamp(18px,3vw,34px);color:var(--muted);
    font-size:clamp(13px,1.6vw,17px);text-align:center;
  }
  .cards{
    display:flex;gap:clamp(14px,2.6vw,32px);flex-wrap:wrap;justify-content:center;
    width:100%;max-width:1000px;
  }
  a.card{
    flex:1 1 260px;max-width:420px;min-width:220px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:clamp(16px,2.6vw,30px) clamp(14px,2.4vw,26px);
    background:#fff;border-radius:26px;text-decoration:none;color:var(--ink);
    box-shadow:0 10px 26px rgba(29,110,196,.16), 0 2px 4px rgba(29,110,196,.10);
    border:3px solid #fff;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  a.card:hover,a.card:focus-visible{
    transform:translateY(-6px);
    box-shadow:0 18px 34px rgba(29,110,196,.24), 0 3px 6px rgba(29,110,196,.14);
    outline:none;
  }
  a.card.eunwoo{border-color:#9ecdf3;}
  a.card.seungwoo{border-color:#a8ddc2;}
  a.card.master{border-color:#cdb4f5;background:linear-gradient(180deg,#fbf7ff 0%,#ffffff 52%);}
  a.card img{width:clamp(84px,12vw,124px);height:auto;display:block;}
  a.card .crown{font-size:clamp(52px,8vw,78px);line-height:1;filter:drop-shadow(0 6px 10px rgba(150,110,20,.28));}
  .name{font-size:clamp(20px,2.6vw,27px);font-weight:800;letter-spacing:-.02em;}
  .desc{font-size:clamp(12px,1.5vw,15px);color:var(--muted);}
  .go{
    margin-top:4px;padding:10px 22px;border-radius:999px;color:#fff;font-weight:800;
    font-size:clamp(13px,1.6vw,16px);
  }
  .eunwoo .go{background:var(--blue);}
  .seungwoo .go{background:#1f9d63;}
  .master .go{background:linear-gradient(135deg,#7b3fd4,#5b23a8);}
  .master .name{color:#4a2094;}
  .master .badge{
    align-self:center;padding:2px 10px 3px;border-radius:999px;
    background:linear-gradient(135deg,#fbeeb2,#eccb62 55%,#d1a52c);color:#4a2f00;
    font-size:clamp(10px,.9vw,12px);font-weight:900;letter-spacing:-.2px;
  }
  footer{
    margin-top:clamp(18px,3vw,34px);color:#6d859c;font-size:clamp(11px,1.3vw,13px);
    text-align:center;line-height:1.6;
  }
</style>
</head>
<body>
  <h1>우리 가족 포켓몬 월드</h1>
  <p class="sub">누구 월드로 들어갈까요?</p>
  <div class="cards">
    <a class="card eunwoo" href="eunwoo/" aria-label="은우 포켓몬 월드 열기">
      <img src="eunwoo/icon-192.png" alt="" width="192" height="192">
      <span class="name">은우</span>
      <span class="desc">은우 포켓몬 월드</span>
      <span class="go">들어가기</span>
    </a>
    <a class="card seungwoo" href="seungwoo/" aria-label="승우 포켓몬 월드 열기">
      <img src="seungwoo/icon-192.png" alt="" width="192" height="192">
      <span class="name">승우</span>
      <span class="desc">승우 포켓몬 월드</span>
      <span class="go">들어가기</span>
    </a>
    <a class="card master" href="master/" aria-label="엄마 마스터 포켓몬 월드 열기">
      <span class="crown" aria-hidden="true">👑</span>
      <span class="name">엄마</span>
      <span class="badge">Lv.99 마스터</span>
      <span class="desc">1,073마리 전부 보유 · 교환 코드 발급</span>
      <span class="go">들어가기</span>
    </a>
  </div>
  <footer>
    태블릿 크롬에서 이 주소를 즐겨찾기(또는 홈 화면에 추가)해 두면 바로 열 수 있어요.<br>
    기록(레벨·도감·코인)은 그 기기에 저장됩니다.
  </footer>
</body>
</html>
